<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" style="background: #f8fafb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Table Card -->
  <g transform="translate(60, 20)" filter="url(#shadow)">
    <rect width="975" height="310" rx="14" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>

    <!-- Table Header & Controls -->
    <g transform="translate(25, 25)">
      <text x="0" y="20" font-size="16" font-weight="700" fill="#192229">Extracted Features</text>
      <!-- Search Input -->
      <rect x="580" y="2" width="180" height="30" rx="6" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>
      <text x="592" y="21" font-size="11" fill="#788591">Search properties or ID...</text>
      <!-- Dropdown -->
      <rect x="770" y="2" width="150" height="30" rx="6" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>
      <text x="782" y="21" font-size="11" fill="#192229">All Geometries ▾</text>
    </g>

    <!-- Table Columns -->
    <g transform="translate(25, 75)">
      <line x1="0" y1="0" x2="925" y2="0" stroke="#e3e7eb" stroke-width="1"/>
      <text x="15" y="20" font-size="10" font-weight="700" fill="#788591" letter-spacing="0.5">ID</text>
      <text x="80" y="20" font-size="10" font-weight="700" fill="#788591" letter-spacing="0.5">GEOMETRY</text>
      <text x="230" y="20" font-size="10" font-weight="700" fill="#788591" letter-spacing="0.5">MEASUREMENT</text>
      <text x="350" y="20" font-size="10" font-weight="700" fill="#788591" letter-spacing="0.5">UNIT</text>
      <text x="430" y="20" font-size="10" font-weight="700" fill="#788591" letter-spacing="0.5">PROPERTIES</text>
      <text x="880" y="20" text-anchor="end" font-size="10" font-weight="700" fill="#788591" letter-spacing="0.5">DETAILS</text>
      <line x1="0" y1="32" x2="925" y2="32" stroke="#e3e7eb" stroke-width="1"/>
    </g>

    <!-- Row #0: Point -->
    <g transform="translate(25, 120)">
      <text x="15" y="20" font-size="13" font-weight="700" fill="#192229">#0</text>
      <rect x="75" y="5" width="48" height="22" rx="4" fill="#e8eef2"/>
      <text x="99" y="20" text-anchor="middle" font-size="11" font-weight="500" fill="#3f5a6c">Point</text>
      <text x="230" y="20" font-size="13" fill="#788591">—</text>
      <text x="350" y="20" font-size="13" fill="#788591">—</text>
      <text x="430" y="20" font-size="12" fill="#4b5863">name: India Gate Benchmark Point</text>
      <rect x="830" y="4" width="50" height="24" rx="4" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>
      <text x="855" y="20" text-anchor="middle" font-size="11" fill="#4b5863">View</text>
      <line x1="0" y1="36" x2="925" y2="36" stroke="#f0f2f4" stroke-width="1"/>
    </g>

    <!-- Row #1: LineString -->
    <g transform="translate(25, 170)">
      <text x="15" y="20" font-size="13" font-weight="700" fill="#192229">#1</text>
      <rect x="75" y="5" width="75" height="22" rx="4" fill="#fcf1f2"/>
      <text x="112" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#c46875">LineString</text>
      <text x="230" y="20" font-size="13" font-weight="700" fill="#192229">5,664.32</text>
      <text x="350" y="20" font-size="12" font-weight="500" fill="#788591">m</text>
      <text x="430" y="20" font-size="12" fill="#4b5863">name: Coastal Transit Corridor (Mumbai)</text>
      <rect x="830" y="4" width="50" height="24" rx="4" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>
      <text x="855" y="20" text-anchor="middle" font-size="11" fill="#4b5863">View</text>
      <line x1="0" y1="36" x2="925" y2="36" stroke="#f0f2f4" stroke-width="1"/>
    </g>

    <!-- Row #2: Polygon -->
    <g transform="translate(25, 220)">
      <text x="15" y="20" font-size="13" font-weight="700" fill="#192229">#2</text>
      <rect x="75" y="5" width="62" height="22" rx="4" fill="#e8eef2"/>
      <text x="106" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#3f5a6c">Polygon</text>
      <text x="230" y="20" font-size="13" font-weight="700" fill="#192229">4,065,968.09</text>
      <text x="350" y="20" font-size="12" font-weight="500" fill="#788591">m²</text>
      <text x="430" y="20" font-size="12" fill="#4b5863">name: Central Vista &amp; India Gate Zone</text>
      <rect x="830" y="4" width="50" height="24" rx="4" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>
      <text x="855" y="20" text-anchor="middle" font-size="11" fill="#4b5863">View</text>
    </g>
  </g>

  <!-- Modern Simple Footer -->
  <g transform="translate(60, 360)">
    <rect width="975" height="60" rx="10" fill="#ffffff" stroke="#d2d7dc" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="35" cy="30" r="7" fill="none" stroke="#557589" stroke-width="1.8"/>
    <text x="50" y="34" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2b3e4b" letter-spacing="1">GEOMEASURE</text>
    <text x="165" y="34" font-size="11" fill="#788591">Geodetic precision system for metric polygon area &amp; geodesic line measurements.</text>

    <!-- API Docs Pill -->
    <g transform="translate(740, 16)">
      <rect width="135" height="28" rx="14" fill="#e8eef2" stroke="#9cb2c0" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle" font-size="11" font-weight="500" fill="#2b3e4b">API Docs (Swagger) ↗</text>
    </g>

    <!-- Version Badge -->
    <g transform="translate(890, 16)">
      <rect width="55" height="28" rx="14" fill="#eceef1" stroke="#d2d7dc" stroke-width="1"/>
      <text x="27" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#788591">v1.0.0</text>
    </g>
  </g>

  <!-- Copyright -->
  <text x="550" y="455" text-anchor="middle" font-size="11" fill="#788591">© 2026 GeoMeasure • Built with FastAPI, GeoPandas &amp; React</text>
</svg>
