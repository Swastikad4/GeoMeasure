<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background: #f8fafb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="65" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="#192229" letter-spacing="1">GEOSPATIAL FILE MEASUREMENT</text>
  <text x="550" y="95" text-anchor="middle" font-size="14" fill="#4b5863">Upload a KML or Shapefile ZIP to analyze its geometry, project CRS, and calculate high-fidelity measurements.</text>
  <text x="550" y="118" text-anchor="middle" font-style="italic" font-size="13" fill="#c46875">Redolent de Géométrie et de Mesure</text>

  <!-- Upload Card -->
  <g transform="translate(100, 175)" filter="url(#shadow)">
    <rect width="900" height="300" rx="14" fill="#ffffff" stroke="#d2d7dc" stroke-width="1"/>

    <!-- Dropzone -->
    <rect x="25" y="25" width="850" height="130" rx="10" fill="#f8fafb" stroke="#557589" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="450" cy="65" r="20" fill="#e8eef2"/>
    <path d="M442 70 L450 62 L458 70 M450 63 L450 77" fill="none" stroke="#557589" stroke-width="2" stroke-linecap="round"/>
    <text x="450" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#192229">Click to upload or drag &amp; drop</text>
    <text x="450" y="125" text-anchor="middle" font-size="12" fill="#788591">Supported formats: .KML, .ZIP (Shapefile)</text>

    <!-- Selected File Banner -->
    <g transform="translate(25, 170)">
      <rect width="850" height="48" rx="8" fill="#f6f8f9" stroke="#e3e7eb" stroke-width="1"/>
      <rect x="15" y="12" width="24" height="24" rx="4" fill="#e8eef2"/>
      <path d="M22 18 L26 24 L22 30 M32 18 L28 24 L32 30" fill="none" stroke="#557589" stroke-width="1.5" stroke-linecap="round"/>
      <text x="50" y="26" font-size="13" font-weight="600" fill="#192229">india_gate_delhi.kml</text>
      <text x="50" y="40" font-size="11" fill="#788591">1.52 KB</text>
    </g>

    <!-- Actions & Sample Buttons -->
    <g transform="translate(25, 235)">
      <text x="0" y="24" font-size="12" font-weight="600" fill="#4b5863">Quick Test (India):</text>
      <rect x="115" y="6" width="115" height="30" rx="6" fill="#f6f8f9" stroke="#d2d7dc" stroke-width="1"/>
      <text x="172" y="25" text-anchor="middle" font-size="11" font-weight="500" fill="#4b5863">India Gate KML</text>

      <rect x="240" y="6" width="140" height="30" rx="6" fill="#f6f8f9" stroke="#d2d7dc" stroke-width="1"/>
      <text x="310" y="25" text-anchor="middle" font-size="11" font-weight="500" fill="#4b5863">Mumbai Routes KML</text>

      <rect x="390" y="6" width="150" height="30" rx="6" fill="#f6f8f9" stroke="#d2d7dc" stroke-width="1"/>
      <text x="465" y="25" text-anchor="middle" font-size="11" font-weight="500" fill="#4b5863">Bengaluru Shapefile</text>

      <!-- Analyze Button -->
      <rect x="710" y="4" width="140" height="34" rx="8" fill="#557589"/>
      <text x="770" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Analyze File →</text>
    </g>
  </g>
</svg>
